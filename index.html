// ===== ISLOMIY MOLIYA TEKSHIRUVI =====
function checkHalal(s) {
  const haramBiz = ["qimor","alkogol","cho'chqa","qurol","ribo","bank","sug'urta"];
  if (haramBiz.includes(s.business)) {
    if (s.business === "bank") return { status: "ribo", reason: "Asosiy faoliyat — foizli bank" };
    return { status: "haram", reason: "Asosiy faoliyat harom" };
  }
  if (s.debtRatio > 30) return { status: "haram", reason: `Foizli qarz ${s.debtRatio}% (chegara: 30%)` };
  if (s.interestIncome > 5) return { status: "haram", reason: `Foizli daromad ${s.interestIncome}% (chegara: 5%)` };
  if (s.debtRatio >= 25 || s.interestIncome >= 4) return { status: "shubhali", reason: `Chegaraga yaqin` };
  return { status: "halal", reason: "AAOIFI standartlariga mos" };
}
STOCKS.forEach(s => { const c = checkHalal(s); s.halal = c.status; s.halalReason = c.reason; });

// ===== UZSE REAL VAQT =====
async function fetchUZSEData() {
  try {
    const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://uzse.uz/trade_results');
    const response = await fetch(url);
    const html = await response.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const tickers = doc.querySelectorAll('.ticker-item');

    tickers.forEach(ticker => {
      const titleLink = ticker.querySelector('.title a');
      if (!titleLink) return;
      const fullName = titleLink.textContent.trim();
      const symbolMatch = fullName.match(/^([A-Z0-9]+)/);
      if (!symbolMatch) return;
      const symbol = symbolMatch[1];
      const prices = ticker.querySelectorAll('.price-value');
      if (prices.length < 2) return;
      const closePrice = parseFloat(prices[0].textContent.replace(/,/g, '')) || 0;
      const lastPrice = parseFloat(prices[1].textContent.replace(/,/g, '')) || 0;

      const stock = STOCKS.find(s => s.symbol === symbol);
      if (stock) {
        const newPrice = lastPrice || closePrice;
        if (newPrice > 0 && stock.price) {
          stock.change = parseFloat(((newPrice - stock.price) / stock.price * 100).toFixed(2));
        }
        if (newPrice > 0) stock.price = newPrice;
      }
    });
    renderStocks(currentFilter, document.getElementById('searchInput').value.trim());
  } catch (e) {
    console.log('UZSE yangilash xatosi:', e);
  }
}

const UZSE_HOLIDAYS = ["2026-01-01","2026-01-02","2026-03-09","2026-03-20","2026-03-21","2026-03-23","2026-05-11","2026-05-27","2026-05-28","2026-05-29","2026-08-31","2026-09-01","2026-12-08","2026-12-31"];

function getTashkentNow() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 5 * 3600000);
}

function getMarketStatus() {
  const now = getTashkentNow();
  const day = now.getDay();
  const hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const cur = hh * 3600 + mm * 60 + ss;
  const openSec = 9*3600 + 30*60, closeSec = 16*3600;

  if (day === 0 || day === 6) {
    const daysLeft = day === 6 ? 2 : 1;
    return { status: "closed", reason: "Dam olish kuni", secLeft: daysLeft*86400 - cur + openSec };
  }
  if (UZSE_HOLIDAYS.includes(todayStr)) {
    return { status: "closed", reason: "Rasmiy bayram", secLeft: 86400 - cur + openSec };
  }
  if (cur >= openSec && cur < closeSec) {
    return { status: "open", reason: "Savdo davom etmoqda", secLeft: closeSec - cur };
  }
  if (cur < openSec) {
    return { status: "pending", reason: "Ochilishga tayyor", secLeft: openSec - cur };
  }
  return { status: "closed", reason: "Savdo tugagan", secLeft: 86400 - cur + openSec };
}

function formatTime(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateMarket() {
  const info = getMarketStatus();
  const dot = document.getElementById('marketDot');
  const title = document.getElementById('marketTitle');
  const sub = document.getElementById('marketSub');
  const timer = document.getElementById('marketTimer');
  dot.className = 'market-dot ' + info.status;
  timer.className = 'market-timer ' + info.status;
  if (info.status === 'open') { title.textContent = '🟢 BOZOR OCHIQ'; sub.textContent = info.reason; }
  else if (info.status === 'pending') { title.textContent = '🟡 OCHILISHGA TAYYOR'; sub.textContent = info.reason; }
  else { title.textContent = '🔴 BOZOR YOPIQ'; sub.textContent = info.reason; }
  timer.textContent = formatTime(info.secLeft);
}

          <div class="stock-price">${s.price.toLocaleString()} so'm</div>
          <div class="stock-change ${cls}">${sign}${s.change}%</div>
        </div>
        <div class="stock-tags">
          ${getHalalTag(s.halal)} ${getAdviceTag(s.advice)}
          <span class="tag">⚠️ ${getRiskLabel(s.risk)}</span>
        </div>
      </div>`;
  }).join('');
}
renderStocks('all', '');

document.getElementById('searchInput').addEventListener('input', e => {
  renderStocks(currentFilter, e.target.value.trim());
});
document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderStocks(currentFilter, document.getElementById('searchInput').value.trim());
});

// ===== MODAL =====
function openStock(symbol) {
  const s = STOCKS.find(x => x.symbol === symbol);
  if (!s) return;
  document.getElementById('modalTitle').textContent = s.symbol + ' — ' + s.name;
  const rng = s.max52 - s.min52;
  const pos = rng > 0 ? Math.round(((s.price - s.min52) / rng) * 100) : 50;
  const cls = s.change >= 0 ? 'up' : 'down';
  const sign = s.change >= 0 ? '+' : '';
  let rsiState = 'normal';
  if (s.rsi < 30) rsiState = 'juda arzon 🔥';
  else if (s.rsi < 45) rsiState = 'arzon';
  else if (s.rsi < 55) rsiState = 'normal';
  else if (s.rsi < 70) rsiState = 'qimmat';
  else rsiState = 'juda qimmat ⚠️';
  const canBuy = s.halal !== 'haram' && s.halal !== 'ribo';
  const adviceText = canBuy
    ? (s.advice === 'buy' ? '✅ OLISH MUMKIN' : s.advice === 'wait' ? '⚖️ KUTISH' : '❌ OLMAY TURING')
    : (s.halal === 'haram' ? '❌ HAROM — Sotib olmang!' : '🚫 RIBO — Sotib olmang!');

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-price">
      <div class="detail-price-num">${s.price.toLocaleString()} so'm</div>
      <div class="detail-price-chg ${cls}">${sign}${s.change}%</div>
    </div>
    <div class="detail-rows">
      <div class="detail-row"><span class="detail-row-label">💰 Dividend</span><span class="detail-row-value">${s.dividend}%</span></div>
      <div class="detail-row"><span class="detail-row-label">📊 P/E</span><span class="detail-row-value">${s.pe}</span></div>
      <div class="detail-row"><span class="detail-row-label">📉 52W MIN</span><span class="detail-row-value">${s.min52.toLocaleString()}</span></div>
      <div class="detail-row"><span class="detail-row-label">📈 52W MAX</span><span class="detail-row-value">${s.max52.toLocaleString()}</span></div>
      <div class="detail-row"><span class="detail-row-label">📈 RSI</span><span class="detail-row-value">${s.rsi} (${rsiState})</span></div>
    </div>
    <div style="margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:6px;">
        <span>📍 52W pozitsiyasi</span><span>${pos}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pos}%"></div></div>
    </div>
    <div style="margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:6px;">
        <span>📊 Uslash foizi (${s.holdTime})</span><span>${s.holdPercent}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${s.holdPercent}%"></div></div>
    </div>
    <div class="detail-rows">
      <div class="detail-row" style="background:rgba(0,255,136,.05);">
        <span class="detail-row-label" style="color:#00ff88;">🕌 Shariat tekshiruvi (AAOIFI)</span>
      </div>
      <div class="detail-row"><span class="detail-row-label">🏭 Asosiy faoliyat</span><span class="detail-row-value">${s.business}</span></div>
      <div class="detail-row"><span class="detail-row-label">💰 Foizli qarz / qiymat</span><span class="detail-row-value" style="color:${s.debtRatio > 30 ? '#ff3b3b' : s.debtRatio >= 25 ? '#ffbb00' : '#00ff88'};">${s.debtRatio}%</span></div>
      <div class="detail-row"><span class="detail-row-label">📊 Foizli daromad</span><span class="detail-row-value" style="color:${s.interestIncome > 5 ? '#ff3b3b' : s.interestIncome >= 4 ? '#ffbb00' : '#00ff88'};">${s.interestIncome}%</span></div>
      <div class="detail-row"><span class="detail-row-label">📝 Xulosa</span><span class="detail-row-value" style="font-size:11px;">${s.halalReason}</span></div>
    </div>
    <div style="text-align:center;font-size:16px;font-weight:700;margin-top:20px;color:${canBuy ? '#00ff88' : '#ff3b3b'};">
      ${adviceText}
    </div>
    <button class="action-btn ${canBuy ? '' : 'disabled'}">${canBuy ? '🛒 Sotib olish' : '🚫 Sotib olib bo\'lmaydi'}</button>
  `;
  document.getElementById('detailModal').classList.add('open');
}
function closeModal() { document.getElementById('detailModal').classList.remove('open'); }
</script>
