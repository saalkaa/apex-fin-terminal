<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const STOCKS = [
  { symbol: "AAPL", name: "🍎 Apple Inc.", price: 150.25, change: 2.3, dividend: 0.55, pe: 28.5, min52: 124.17, max52: 199.62, rsi: 45, risk: "past", halal: "halal", holdTime: "2-3 kun", holdPercent: 78, advice: "buy" },

  { symbol: "GOOGL", name: "🔍 Google", price: 138.75, change: -0.8, dividend: 0, pe: 24.3, min52: 115.83, max52: 155.20, rsi: 38, risk: "orta", halal: "halal", holdTime: "5-7 kun", holdPercent: 85, advice: "buy" },
  { symbol: "TSLA", name: "🚗 Tesla", price: 245.80, change: -3.5, dividend: 0, pe: 45.2, min52: 138.80, max52: 299.29, rsi: 58, risk: "baland", halal: "halal", holdTime: "1-2 kun", holdPercent: 45, advice: "wait" },
  { symbol: "AMZN", name: "📦 Amazon", price: 178.35, change: 1.8, dividend: 0, pe: 42.8, min52: 118.35, max52: 191.70, rsi: 60, risk: "orta", halal: "halal", holdTime: "3-5 kun", holdPercent: 68, advice: "wait" },
  { symbol: "META", name: "📘 Meta", price: 505.20, change: 2.7, dividend: 0.4, pe: 26.5, min52: 274.38, max52: 531.49, rsi: 68, risk: "orta", halal: "shubhali", holdTime: "2-4 kun", holdPercent: 62, advice: "wait" },
  { symbol: "NVDA", name: "🎮 NVIDIA", price: 875.30, change: 4.2, dividend: 0.02, pe: 65.8, min52: 392.30, max52: 974.00, rsi: 72, risk: "juda_baland", halal: "halal", holdTime: "1-2 kun", holdPercent: 35, advice: "sell" },
  { symbol: "JPM", name: "🏦 JPMorgan", price: 195.40, change: 0.9, dividend: 2.4, pe: 11.8, min52: 135.19, max52: 200.94, rsi: 55, risk: "past", halal: "ribo", holdTime: "7-10 kun", holdPercent: 82, advice: "wait" },
  { symbol: "MGM", name: "🎰 MGM Resorts", price: 42.10, change: -1.2, dividend: 0, pe: 13.2, min52: 34.15, max52: 51.30, rsi: 42, risk: "baland", halal: "haram", holdTime: "2-3 kun", holdPercent: 48, advice: "sell" },
  { symbol: "KO", name: "🥤 Coca-Cola", price: 62.85, change: 0.3, dividend: 3.1, pe: 24.5, min52: 51.55, max52: 64.99, rsi: 48, risk: "past", halal: "halal", holdTime: "10-14 kun", holdPercent: 88, advice: "buy" }
];

// ===== UZSE REAL VAQT MA'LUMOTLARINI OLISH =====
async function fetchUZSEData() {
    try {
        const url = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://uzse.uz/trade_results');
        const response = await fetch(url);
        const html = await response.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const tickers = doc.querySelectorAll('.ticker-item');
        
        tickers.forEach(ticker => {
            const titleLink = ticker.querySelector('.title a');
            if (!titleLink) return;
            const fullName = titleLink.textContent.trim();
            const symbolMatch = fullName.match(/^([A-Z0-9]+)/);
            if (!symbolMatch) return;
            const symbol = symbolMatch[1];
            const prices = ticker.querySelectorAll('.price-value');
            if (prices.length < 2) return;
            const closePrice = parseFloat(prices[0].textContent.replace(/,/g, '')) || 0;
            const lastPrice = parseFloat(prices[1].textContent.replace(/,/g, '')) || 0;
            
            const stock = STOCKS.find(s => s.symbol === symbol);
            if (stock) {
                stock.price = lastPrice || closePrice;
                if (stock.prevPrice) {
                    stock.change = ((stock.price - stock.prevPrice) / stock.prevPrice * 100).toFixed(2);
                }
                stock.prevPrice = stock.price;
            }
        });
        
        renderStocks(currentFilter, document.getElementById('searchInput').value.trim());
        
    } catch (error) {
        console.error('UZSE ma\'lumotlarini olishda xatolik:', error);
    }
}

fetchUZSEData();
setInterval(fetchUZSEData, 30000);
const UZSE_HOLIDAYS = ["2026-01-01","2026-01-02","2026-03-09","2026-03-20","2026-03-21","2026-03-23","2026-05-11","2026-05-27","2026-05-28","2026-05-29","2026-08-31","2026-09-01","2026-12-08","2026-12-31"];

function getTashkentNow() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 5 * 3600000);
}

function getMarketStatus() {
  const now = getTashkentNow();
  const day = now.getDay();
  const hh = now.getHours();
  const mm = now.getMinutes();
  const ss = now.getSeconds();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const cur = hh * 3600 + mm * 60 + ss;

  const openSec = 9 * 3600 + 30 * 60;
  const closeSec = 16 * 3600;

  if (day === 0 || day === 6) {
    let daysLeft = day === 6 ? 2 : 1;
    const secLeft = daysLeft * 86400 - cur + openSec;
    return { status: "closed", reason: "Dam olish kuni", secLeft, next: "Dushanba 09:30" };
  }

  if (UZSE_HOLIDAYS.includes(todayStr)) {
    return { status: "closed", reason: "Rasmiy bayram", secLeft: 86400 - cur + openSec, next: "Keyingi ish kuni" };
  }

  if (cur >= openSec && cur < closeSec) {
    return { status: "open", reason: "Savdo davom etmoqda", secLeft: closeSec - cur, next: "16:00 da yopiladi" };
  }

  if (cur < openSec) {
    return { status: "pending", reason: "Ochilishga tayyor", secLeft: openSec - cur, next: "09:30 da ochiladi" };
  }

  const secLeft = 86400 - cur + openSec;
  return { status: "closed", reason: "Savdo tugagan", secLeft, next: "Ertaga 09:30" };
}

function formatTime(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateMarket() {
  const info = getMarketStatus();
  const dot = document.getElementById('marketDot');
  const title = document.getElementById('marketTitle');
  const sub = document.getElementById('marketSub');
  const timer = document.getElementById('marketTimer');

  dot.className = 'market-dot ' + info.status;
  timer.className = 'market-timer ' + info.status;

  if (info.status === 'open') {
    title.textContent = '🟢 BOZOR OCHIQ';
    sub.textContent = info.reason + ' • Yopilishga:';
  } else if (info.status === 'pending') {
    title.textContent = '🟡 OCHILISHGA TAYYOR';
    sub.textContent = info.reason + ' • Ochilishga:';
  } else {
    title.textContent = '🔴 BOZOR YOPIQ';
    sub.textContent = info.reason + ' • Keyingisiga:';
  }
  timer.textContent = formatTime(info.secLeft);
}
setInterval(updateMarket, 1000);
updateMarket();

function getHalalTag(h) {
  if (h === 'halal') return '<span class="tag halal">✅ Halol</span>';
  if (h === 'haram') return '<span class="tag haram">❌ Harom</span>';
  if (h === 'ribo') return '<span class="tag ribo">🚫 Ribo</span>';
  return '<span class="tag shubhali">⚠️ Shubhali</span>';
}

function getAdviceTag(a) {
  if (a === 'buy') return '<span class="tag advice-buy">🎯 Olish mumkin</span>';
  if (a === 'wait') return '<span class="tag advice-wait">⚖️ Kutish</span>';
  return '<span class="tag advice-sell">❌ Olmay turing</span>';
}

function getRiskLabel(r) {
  if (r === 'past') return '🟢 Past';
  if (r === 'orta') return '🟡 O\'rta';
  if (r === 'baland') return '🟠 Baland';
  return '🔴 Juda baland';
}

function renderStocks(filter = 'all', query = '') {
  const container = document.getElementById('stocksContainer');
  let list = STOCKS.slice();

  if (query) {
    const q = query.toLowerCase();
    list = list.filter(s => s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
  }

  if (filter === 'halal') list = list.filter(s => s.halal === 'halal');
  if (filter === 'buy') list = list.filter(s => s.advice === 'buy');
  if (filter === 'low') list = list.filter(s => s.risk === 'past');

  if (!list.length) {
    container.innerHTML = '<div class="empty">Hech narsa topilmadi 🔍</div>';
    return;
  }

  container.innerHTML = list.map(s => {
    const cls = s.change >= 0 ? 'up' : 'down';
    const sign = s.change >= 0 ? '+' : '';
    return `
      <div class="stock-card ${s.halal}" onclick="openStock('${s.symbol}')">
        <div class="stock-row1">
          <div><span class="stock-name">${s.name}</span><span class="stock-symbol">${s.symbol}</span></div>
        </div>
        <div class="stock-row2">
          <div class="stock-price">$${s.price.toFixed(2)}</div>
          <div class="stock-change ${cls}">${sign}${s.change}%</div>
        </div>
        <div class="stock-tags">
          ${getHalalTag(s.halal)}
          ${getAdviceTag(s.advice)}
          <span class="tag">⚠️ ${getRiskLabel(s.risk)}</span>
        </div>
      </div>
    `;
  }).join('');
}
renderStocks();

let currentFilter = 'all';
document.getElementById('searchInput').addEventListener('input', (e) => {
  renderStocks(currentFilter, e.target.value.trim());
});

document.getElementById('filters').addEventListener('click', (e) => {
  const btn = e.target.closest('.filter-btn');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter = btn.dataset.filter;
  renderStocks(currentFilter, document.getElementById('searchInput').value.trim());
});

function openStock(symbol) {
  const s = STOCKS.find(x => x.symbol === symbol);
  if (!s) return;
  const modal = document.getElementById('detailModal');
  document.getElementById('modalTitle').textContent = s.symbol + ' — ' + s.name;

  const rng = s.max52 - s.min52;
  const pos = rng > 0 ? Math.round(((s.price - s.min52) / rng) * 100) : 50;
  const cls = s.change >= 0 ? 'up' : 'down';
  const sign = s.change >= 0 ? '+' : '';

  let rsiState = 'normal';
  if (s.rsi < 30) rsiState = 'juda arzon 🔥';
  else if (s.rsi < 45) rsiState = 'arzon';
  else if (s.rsi < 55) rsiState = 'normal';
  else if (s.rsi < 70) rsiState = 'qimmat';
  else rsiState = 'juda qimmat ⚠️';

  const canBuy = s.halal !== 'haram' && s.halal !== 'ribo';
  const adviceText = canBuy
    ? (s.advice === 'buy' ? '✅ OLISH MUMKIN' : s.advice === 'wait' ? '⚖️ KUTISH' : '❌ OLMAY TURING')
    : (s.halal === 'haram' ? '❌ HAROM — Sotib olmang!' : '🚫 RIBO — Sotib olmang!');

  document.getElementById('modalBody').innerHTML = `
    <div class="detail-price">
      <div class="detail-price-num">$${s.price.toFixed(2)}</div>
      <div class="detail-price-chg ${cls}">${sign}${s.change}%</div>
    </div>

    <div class="detail-rows">
      <div class="detail-row"><span class="detail-row-label">💰 Dividend</span><span class="detail-row-value">${s.dividend}%</span></div>
      <div class="detail-row"><span class="detail-row-label">📊 P/E</span><span class="detail-row-value">${s.pe}</span></div>
      <div class="detail-row"><span class="detail-row-label">📉 52W MIN</span><span class="detail-row-value">$${s.min52}</span></div>
      <div class="detail-row"><span class="detail-row-label">📈 52W MAX</span><span class="detail-row-value">$${s.max52}</span></div>
      <div class="detail-row"><span class="detail-row-label">📈 RSI</span><span class="detail-row-value">${s.rsi} (${rsiState})</span></div>
    </div>

    <div style="margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:6px;">
        <span>📍 52W pozitsiyasi</span><span>${pos}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pos}%"></div></div>
    </div>

    <div style="margin:16px 0;">
      <div style="display:flex;justify-content:space-between;font-size:11px;color:#888;margin-bottom:6px;">
        <span>📊 Uslash foizi (${s.holdTime})</span><span>${s.holdPercent}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${s.holdPercent}%"></div></div>
    </div>

    <div class="detail-rows">
      <div class="detail-row"><span class="detail-row-label">🕌 Holat</span><span class="detail-row-value">${getHalalTag(s.halal)}</span></div>
      <div class="detail-row"><span class="detail-row-label">⚠️ Xavf</span><span class="detail-row-value">${getRiskLabel(s.risk)}</span></div>
      <div class="detail-row"><span class="detail-row-label">⏱ Uslash vaqti (+-1%)</span><span class="detail-row-value">${s.holdTime}</span></div>
    </div>

    <div style="text-align:center;font-size:16px;font-weight:700;margin-top:20px;color:${canBuy ? '#00ff88' : '#ff3b3b'};">
      ${adviceText}
    </div>

    <button class="action-btn ${canBuy ? '' : 'disabled'}" onclick="${canBuy ? `buyStock('${s.symbol}')` : ''}">
      ${canBuy ? '🛒 Sotib olish' : '🚫 Sotib olib bo\'lmaydi'}
    </button>
  `;

  modal.classList.add('open');
}

function closeModal() {
  document.getElementById('detailModal').classList.remove('open');
}

function buyStock(symbol) {
  const s = STOCKS.find(x => x.symbol === symbol);
  if (!s) return;
  tg?.showPopup({
    title: "✅ Sotib olindi",
    message: `${s.name} — $${s.price}`,
    buttons: [{ type: "ok" }]
  });
}
</script>
</body>
</html>
