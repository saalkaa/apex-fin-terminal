// ===== ISLOMIY MOLIYA =====
function checkHalal(s) {
  const haramBiz = ["qimor","alkogol","cho'chqa","qurol","ribo","bank","sug'urta"];
  if (haramBiz.includes(s.business)) {
    if (s.business === "bank") return { status: "ribo", reason: "Asosiy faoliyat — foizli bank" };
    return { status: "haram", reason: "Asosiy faoliyat harom" };
  }
  if (s.debtRatio > 30) return { status: "haram", reason: `Foizli qarz ${s.debtRatio}% (chegara: 30%)` };
  if (s.interestIncome > 5) return { status: "haram", reason: `Foizli daromad ${s.interestIncome}% (chegara: 5%)` };
  if (s.debtRatio >= 25 || s.interestIncome >= 4) return { status: "shubhali", reason: "Chegaraga yaqin" };
  return { status: "halal", reason: "AAOIFI standartlariga mos" };
}

// ===== UZSE REAL VAQT (VEB-SKREYAPING) =====
async function fetchUZSEScrape() {
  try {
    const proxies = [
      'https://api.allorigins.win/raw?url=',
      'https://corsproxy.io/?',
      'https://api.codetabs.com/v1/proxy?quest='
    ];
    const uzseUrl = 'https://www.uzse.uz/trade_results?locale=uz';
    let html = null;
    for (const proxy of proxies) {
      try {
        const r = await fetch(proxy + encodeURIComponent(uzseUrl));
        if (r.ok) { html = await r.text(); break; }
      } catch(e) { continue; }
    }
    if (!html) { console.log('⚠️ UZSE proxy ishlamadi'); return; }

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const rows = doc.querySelectorAll('tr');
    let updated = 0;

    rows.forEach(row => {
      const cells = row.querySelectorAll('td');
      if (cells.length < 3) return;
      const tickerText = cells[0].textContent.trim();
      const symbolMatch = tickerText.match(/^([A-Z]{2,6})$/);
      if (!symbolMatch) return;
      const symbol = symbolMatch[1];
      const stock = STOCKS.find(s => s.symbol === symbol);
      if (!stock) return;

      for (let i = 1; i < cells.length; i++) {
        const val = parseFloat(cells[i].textContent.trim().replace(/\s/g, '').replace(',', '.'));
        if (val > 0 && val < 10000000) {
          const oldPrice = stock.price;
          stock.price = Math.round(val);
          if (oldPrice && oldPrice !== stock.price) {
            stock.change = parseFloat(((stock.price - oldPrice) / oldPrice * 100).toFixed(2));
          }
          updated++;
          break;
        }
      }
    });

    if (updated > 0) {

      console.log('⚠️ UZSE: yangilanadigan aksiya topilmadi');
    }
  } catch (e) {
    console.log('❌ UZSE xatosi:', e);
  }
}

// ===== GRAFIK UCHUN DATA =====
function generateChartData(symbol, currentPrice, trend, days) {
  let seed = 0;
  for (let i = 0; i < symbol.length; i++) seed += symbol.charCodeAt(i);
  const data = [];
  let price = currentPrice * (1 - (trend * days) / 100);
  function rand() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (let i = 0; i < days; i++) {
    const dailyChange = (rand() - 0.45) * 0.03 + (trend / days / 100);
    price = price * (1 + dailyChange);
    data.push(Math.round(price));
  }
  data[data.length - 1] = currentPrice;
  return data;
}

function drawChart(canvasId, data, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  ctx.scale(dpr, dpr);
  ctx.clearRect(0, 0, w, h);
  const min = Math.min(...data), max = Math.max(...data);
  const range = max - min || 1;
  const pad = 10;

  ctx.strokeStyle = '#1f1f1f'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad + ((h - pad * 2) / 4) * i;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
  }

  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, color + '40');
  grad.addColorStop(1, color + '00');

  const points = data.map((p, i) => ({
    x: (i / (data.length - 1)) * w,
    y: h - pad - ((p - min) / range) * (h - pad * 2)
  }));

  ctx.beginPath();
  ctx.moveTo(points[0].x, h);
  points.forEach(pt => ctx.lineTo(pt.x, pt.y));
  ctx.lineTo(points[points.length - 1].x, h);
  ctx.closePath();
  ctx.fillStyle = grad; ctx.fill();

  ctx.beginPath();
  points.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

  const last = points[points.length - 1];
  ctx.beginPath(); ctx.arc(last.x - 2, last.y, 4, 0, Math.PI * 2);
  ctx.fillStyle = color; ctx.fill();
  ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 2; ctx.stroke();
}

const UZSE_HOLIDAYS = ["2026-01-01","2026-01-02","2026-03-09","2026-03-20","2026-03-21","2026-03-23","2026-05-11","2026-05-27","2026-05-28","2026-05-29","2026-08-31","2026-09-01","2026-12-08","2026-12-31"];

function getTashkentNow() {
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset() * 60000;
  return new Date(utc + 5 * 3600000);
}

function getMarketStatus() {
  const now = getTashkentNow();
  const day = now.getDay();
  const hh = now.getHours(), mm = now.getMinutes(), ss = now.getSeconds();
  const todayStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  const cur = hh * 3600 + mm * 60 + ss;
  const openSec = 9*3600 + 30*60, closeSec = 16*3600;
  if (day === 0 || day === 6) { const dl = day === 6 ? 2 : 1;
    return { status: "closed", reason: "Dam olish kuni", secLeft: dl*86400 - cur + openSec }; }
  if (UZSE_HOLIDAYS.includes(todayStr))
    return { status: "closed", reason: "Rasmiy bayram", secLeft: 86400 - cur + openSec };
  if (cur >= openSec && cur < closeSec)
    return { status: "open", reason: "Savdo davom etmoqda", secLeft: closeSec - cur };
  if (cur < openSec)
    return { status: "pending", reason: "Ochilishga tayyor", secLeft: openSec - cur };
  return { status: "closed", reason: "Savdo tugagan", secLeft: 86400 - cur + openSec };
}

function formatTime(sec) {
  if (sec < 0) sec = 0;
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function updateMarket() {
  const info = getMarketStatus();
  const dot = document.getElementById('marketDot');
  const title = document.getElementById('marketTitle');
  const sub = document.getElementById('marketSub');
  const timer = document.getElementById('marketTimer');
  dot.className = 'market-dot ' + info.status;
  timer.className = 'market-timer ' + info.status;
  if (info.status === 'open') { title.textContent = '🟢 BOZOR OCHIQ'; sub.textContent = info.reason; }
  else if (info.status === 'pending') { title.textContent = '🟡 OCHILISHGA TAYYOR'; sub.textContent = info.reason; }
  else { title.textContent = '🔴 BOZOR YOPIQ'; sub.textContent = info.reason; }
  timer.textContent = formatTime(info.secLeft);
}
setInterval(updateMarket, 1000);

function getAdviceTag(a) {
  if (a === 'buy') return '<span class="tag advice-buy">🎯 Olish</span>';
  if (a === 'wait') return '<span class="tag advice-wait">⚖️ Kutish</span>';

}

  if (r === 'past') return '🟢 Past';

function renderStocks(filter, query) {
  const container = document.getElementById('stocksContainer');
  let list = STOCKS.slice();
  if (query) { const q = query.toLowerCase();
    list = list.filter(s => s.symbol.toLowerCase().includes(q) || s.name.toLowerCase().includes(q)); }
  if (filter === 'halal') list = list.filter(s => s.halal === 'halal');
  if (filter === 'buy') list = list.filter(s => s.advice === 'buy');
  if (filter === 'low') list = list.filter(s => s.risk === 'past');
  if (!list.length) { container.innerHTML = '<div class="empty">Hech narsa topilmadi 🔍</div>'; return; }
  container.innerHTML = list.map(s => {
    const cls = s.change >= 0 ? 'up' : 'down';
    const sign = s.change >= 0 ? '+' : '';
    return `
      <div class="stock-card ${s.halal}" onclick="openStock('${s.symbol}')">
        <div class="stock-row1">
          <div><span class="stock-name">${s.name}</span><span class="stock-symbol">${s.symbol}</span></div>

        </div>
      </div>`;
  }).join('');
}
